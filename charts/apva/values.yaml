image:
  repository: ghcr.io/gade-raghav/apva
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

prometheus:
  # Prometheus-compatible query endpoint (Prometheus, Thanos, Mimir, VictoriaMetrics)
  url: http://prometheus-server.monitoring.svc:80

analysis:
  window: 24h        # look-back used for p95 usage
  recentWindow: 1h   # used for the traffic trend
  refresh: 5m
  headroom: 0.15
  namespaces: ""     # comma-separated; empty = all non-system namespaces
  includeSystem: false

# Automatic resizing (opt-in). When enabled, APVA patches the CPU/memory requests of
# Deployments and StatefulSets it analyses, with guardrails: confidence threshold,
# cooldown, max downsize step, never above container limits, HPA-managed workloads and
# workloads annotated apva.io/auto-resize: "off" are skipped. Grants APVA RBAC to
# get/list/patch deployments and statefulsets and to list HPAs.
autoResize:
  enabled: false
  dryRun: false          # decide and show what would change, without patching
  minConfidence: high    # high needs >= 24h of data; use medium for short windows / demos
  cooldown: 30m
  maxDownStep: 0.5       # shrink at most 50% per step
  # auto: resize running pods in place (Kubernetes 1.33+, GA in 1.35; no restart) when
  # possible, otherwise a rolling update. in-place: never roll. rollout: never in place.
  resizeMode: auto
  # A Cluster Autoscaler adds nodes for Pending pods, so upsizes that don't fit yet may go
  # ahead. Karpenter nodes are detected automatically.
  nodeAutoscalerPresent: false

# Amazon EKS node groups (needs autoResize.enabled). APVA checks that larger pods fit
# before resizing them; with aws.enabled it scales the listed EKS managed node groups up
# first (and waits for the nodes), and after downsizing it drains under-used nodes and
# removes exactly those instances. See docs/aws.md for the IAM policy.
aws:
  enabled: false
  cluster: ""            # EKS cluster name
  region: ""             # e.g. us-east-1
  nodegroups: ""         # comma-separated allowlist of managed node groups APVA may scale
  consolidate: true      # drain and remove under-used nodes
  consolidateBelow: 0.5  # candidate when CPU, memory and GPU requests are all below 50%
  scaleUpTimeout: 15m
  drainTimeout: 10m
  cooldown: 10m          # between two changes to one node group

security:
  # ValidatingAdmissionPolicies (Kubernetes 1.30+) that limit APVA's patches to resource
  # requests and apva.io/* annotations (workloads) and cordoning (nodes), even if its
  # credentials were stolen. See docs/security.md. Disable only on clusters < 1.30.
  admissionPolicy:
    enabled: true

# IRSA: eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
# (with EKS Pod Identity, create the association instead; no annotation needed)
serviceAccount:
  annotations: {}

# Run with the built-in sample cluster (no Prometheus needed) — for demos.
demo: false

replicaCount: 1
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: false     # set true if you run the Prometheus Operator

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
