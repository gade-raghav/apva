apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apva.fullname" . }}
  labels: {{- include "apva.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "apva.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "apva.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "apva.fullname" . }}
      automountServiceAccountToken: {{ .Values.autoResize.enabled }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: apva
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:8080
            - --prometheus-url={{ .Values.prometheus.url }}
            - --window={{ .Values.analysis.window }}
            - --recent-window={{ .Values.analysis.recentWindow }}
            - --refresh={{ .Values.analysis.refresh }}
            - --headroom={{ .Values.analysis.headroom }}
            {{- with .Values.analysis.namespaces }}
            - --namespaces={{ . }}
            {{- end }}
            {{- if .Values.analysis.includeSystem }}
            - --include-system
            {{- end }}
            {{- if .Values.autoResize.enabled }}
            - --auto-resize
            - --auto-resize-min-confidence={{ .Values.autoResize.minConfidence }}
            - --auto-resize-cooldown={{ .Values.autoResize.cooldown }}
            - --auto-resize-max-down={{ .Values.autoResize.maxDownStep }}
            {{- if .Values.autoResize.dryRun }}
            - --auto-resize-dry-run
            {{- end }}
            {{- end }}
            {{- if .Values.demo }}
            - --demo
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
