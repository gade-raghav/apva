{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "apva.fullname" . }}
  labels: {{- include "apva.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "apva.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
{{- end }}
