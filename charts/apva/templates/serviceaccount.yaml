# APVA only needs Kubernetes API access when autoResize.enabled (see rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "apva.fullname" . }}
  labels: {{- include "apva.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
