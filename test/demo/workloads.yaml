            - {name: MEM_MIB, value: "60"}
            - {name: PEERS, value: ""}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 192Mi}
          volumeMounts: [{name: sim, mountPath: /sim}]
      volumes: [{name: sim, configMap: {name: loadsim}}]
---
