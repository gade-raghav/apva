            - {name: MEM_MIB, value: "80"}
            - {name: PEERS, value: "http://redis:8080"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 500m, memory: 384Mi}
          volumeMounts: [{name: sim, mountPath: /sim}]
      volumes: [{name: sim, configMap: {name: loadsim}}]
---
