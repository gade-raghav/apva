---
# orders-api scales horizontally, so APVA leaves its requests alone (the HPA target
# utilisation already provides headroom). No metrics-server is needed for the demo.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: orders-api, namespace: shop}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: orders-api}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
