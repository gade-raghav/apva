# Recommendation CRD — DRAFT for v0.2 (see ROADMAP.md). Not installed by the v0.1 chart.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: recommendations.apva.io
spec:
  group: apva.io
  names: {kind: Recommendation, listKind: RecommendationList, plural: recommendations, singular: recommendation, shortNames: [apvarec]}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Target, type: string, jsonPath: .spec.targetRef.name}
        - {name: CPU, type: string, jsonPath: .status.cpu.action}
        - {name: Memory, type: string, jsonPath: .status.memory.action}
        - {name: GPU, type: string, jsonPath: .status.gpu.action}
        - {name: Confidence, type: string, jsonPath: .status.confidence}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef]
              properties:
                targetRef:
                  type: object
                  required: [kind, name]
                  properties:
                    apiVersion: {type: string}
                    kind: {type: string}
                    name: {type: string}
            status:
              type: object
              properties:
                observedAt: {type: string, format: date-time}
                confidence: {type: string, enum: [high, medium, low]}
                reasons: {type: array, items: {type: string}}
                cpu:
                  type: object
                  properties:
                    current: {type: string}
                    recommended: {type: string}
                    action: {type: string}
                memory:
                  type: object
                  properties:
                    current: {type: string}
                    recommended: {type: string}
                    action: {type: string}
                gpu:
                  type: object
                  properties:
                    requested: {type: number}
                    p95UtilPct: {type: number}
                    action: {type: string}
